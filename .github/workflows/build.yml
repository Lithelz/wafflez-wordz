name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    name: Core engine tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  mac-app:
    name: Mac app (macOS)
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Test core
        run: swift test
      - name: Build app
        run: ./scripts/build_app.sh
      - name: Smoke test (launch the app and take screenshots)
        run: |
          BIN="build/Wafflez Wordz.app/Contents/MacOS/WafflezWordz"
          mkdir -p shots
          "$BIN" & PID=$!
          sleep 10
          kill -0 $PID && echo "✓ App launched and is still running"
          screencapture -x shots/01-first-launch.png || true
          kill $PID; sleep 2
          # Wafflez in another app: open TextEdit with sample text and look for underlines + widget.
          printf 'Hi team,\n\nI just wanted to say that its a very good idea to meet in order to plan the the launch. Me and him went to the office yesterday, and the report was written by Sam. Thanks guys!\n' > /tmp/sample.txt
          open -a TextEdit /tmp/sample.txt
          sleep 4
          "$BIN" --no-welcome --everywhere-test & PID=$!
          sleep 3
          osascript -e 'tell application "TextEdit" to activate' || true
          sleep 6
          screencapture -x shots/02-textedit-card.png || true
          sleep 4
          screencapture -x shots/03-textedit-sidepanel.png || true
          kill $PID; sleep 1
          osascript -e 'tell application "TextEdit" to quit saving no' || true
          for s in documents agents humanizer detector plagiarism chat insights settings; do
            "$BIN" --no-welcome --section $s & PID=$!
            sleep 7
            kill -0 $PID && echo "✓ $s screen is running"
            screencapture -x "shots/$s.png" || true
            kill $PID; sleep 2
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
      - name: Print screenshots (base64, for remote review)
        if: always()
        run: |
          for f in shots/*.png; do
            [ -f "$f" ] || continue
            sips -Z 1300 -s format jpeg -s formatOptions 62 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "=====BEGIN $(basename "${f%.png}")====="
            base64 -i "${f%.png}.jpg" | fold -w 1000
            echo "=====END====="
          done
      - name: Zip app
        run: cd build && ditto -c -k --keepParent "Wafflez Wordz.app" "Wafflez-Wordz.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Wafflez-Wordz-app
          path: build/Wafflez-Wordz.zip
      - name: Publish the app as the "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "build/Wafflez-Wordz.zip" \
            --title "Wafflez Wordz — latest build" \
            --target "$GITHUB_SHA" \
            --notes "Download **Wafflez-Wordz.zip** below, unzip it, and move **Wafflez Wordz.app** to Applications. See the README for the copy-paste install commands."
